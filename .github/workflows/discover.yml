name: discover
# Temporary: prints available Android SDK platforms and library versions so the build can pin them.
on:
  push:
    paths: ['.github/workflows/discover.yml']
jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - name: SDK platforms on runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list 2>/dev/null | grep -E '^\s*(platforms;android-[0-9A-Za-z.-]+|build-tools;[0-9.rc -]+|system-images;android-3[4-9];google_apis;x86_64)\s' | sort -u | tail -40
      - name: Google Maven versions
        run: |
          v() { curl -s "https://dl.google.com/dl/android/maven2/$1/maven-metadata.xml" | grep -oE '<version>[^<]+' | sed 's/<version>//' | grep -vE 'alpha|beta|rc|dev' | tail -n ${2:-4} | tr '\n' ' '; echo " <- $1"; }
          vp() { curl -s "https://dl.google.com/dl/android/maven2/$1/maven-metadata.xml" | grep -oE '<version>[^<]+' | sed 's/<version>//' | tail -n 4 | tr '\n' ' '; echo " <- $1 (incl. pre)"; }
          v com/android/tools/build/gradle 8
          v androidx/compose/compose-bom 4
          v androidx/compose/material3/material3 5
          vp androidx/compose/material3/material3
          v androidx/compose/material3/material3-adaptive-navigation-suite 3
          v androidx/compose/material3/adaptive/adaptive 3
          v androidx/compose/material3/adaptive/adaptive-navigation 3
          v androidx/activity/activity-compose 3
          v androidx/navigation/navigation-compose 3
          v androidx/navigation3/navigation3-runtime 3
          v androidx/lifecycle/lifecycle-runtime-compose 3
          v androidx/lifecycle/lifecycle-viewmodel-navigation3 3
          v androidx/room/room-runtime 3
          v androidx/datastore/datastore-preferences 3
          v androidx/work/work-runtime 3
          v androidx/hilt/hilt-navigation-compose 3
          v androidx/hilt/hilt-lifecycle-viewmodel-compose 3
          v androidx/hilt/hilt-work 3
          v androidx/core/core-ktx 3
          v androidx/core/core-splashscreen 3
          v androidx/documentfile/documentfile 3
          v androidx/graphics/graphics-shapes 3
          v androidx/test/runner 3
          v androidx/test/core 3
          v androidx/test/ext/junit 3
          v androidx/test/uiautomator/uiautomator 3
          v androidx/compose/ui/ui-test-junit4 3
          v androidx/profileinstaller/profileinstaller 3
          v androidx/window/window 3
          v com/google/android/material/material 3
          v androidx/exifinterface/exifinterface 3
      - name: Maven Central / plugin versions (Google-hosted plugins)
        run: |
          m() { curl -s "https://repo.maven.apache.org/maven2/$1/maven-metadata.xml" | grep -oE '<version>[^<]+' | sed 's/<version>//' | grep -vE 'alpha|beta|RC|rc|dev|M[0-9]' | tail -n ${2:-4} | tr '\n' ' '; echo " <- $1"; }
          m com/google/dagger/hilt-android 4
          m com/google/devtools/ksp/com.google.devtools.ksp.gradle.plugin 6
          m org/maplibre/gl/android-sdk 6
          m io/coil-kt/coil3/coil-compose 3
          m app/cash/turbine/turbine 3
          m org/robolectric/robolectric 3
          m com/diffplug/spotless/spotless-plugin-gradle 3
          m org/jetbrains/kotlinx/kotlinx-serialization-json 3
          m org/jetbrains/kotlinx/kotlinx-coroutines-core 3
          m de/mannodermaus/gradle/plugins/android-junit5 3
          m com/squareup/okhttp3/okhttp 3
          m io/github/takahirom/roborazzi/roborazzi 3
          curl -s https://plugins.gradle.org/m2/com/android/application/com.android.application.gradle.plugin/maven-metadata.xml | grep -oE '<version>[^<]+' | sed 's/<version>//' | tail -5 | tr '\n' ' '; echo "<- AGP plugin marker"
      - name: KVM
        run: ls -l /dev/kvm || echo "no kvm"; nproc; free -g
      - name: Tiny artifact
        run: mkdir -p out && echo "artifact-probe" > out/probe.txt
      - uses: actions/upload-artifact@v4
        with:
          name: probe
          path: out/probe.txt
