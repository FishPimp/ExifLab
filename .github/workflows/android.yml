name: android

on:
  push:
    paths-ignore:
      - 'docs/**'
      - 'spike/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  CI: 'true'

jobs:
  engine:
    name: Engine tests (exiftool-verified)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install exiftool
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/et" exiftool-vendored.pl@13.59.3
          echo "EXIFTOOL=perl $RUNNER_TEMP/et/node_modules/exiftool-vendored.pl/bin/exiftool" >> "$GITHUB_ENV"
      - name: Engine tests
        run: |
          set -o pipefail
          ./gradlew -p engine test --console=plain 2>&1 | tee "$RUNNER_TEMP/engine.log"
      - name: Error digest
        if: failure()
        run: |
          echo "=== DIGEST ==="
          grep -E "^e: |FAILED|What went wrong|Exception|expected|but was|AssertionFailed" "$RUNNER_TEMP/engine.log" | head -150
          echo "=== END DIGEST ==="
      - name: Upload engine reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: engine-reports
          path: engine/**/build/reports/**
          if-no-files-found: ignore

  android:
    name: Build, lint, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, lint and unit tests
        run: |
          set -o pipefail
          ./gradlew assembleDebug assembleRelease lintDebug testDebugUnitTest --console=plain --continue 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Error digest
        if: failure()
        run: |
          echo "=== DIGEST ==="
          grep -E "^e: |^\[ksp\]|error:|What went wrong|^> |Lint found|FAILED|warning:.*\[" "$RUNNER_TEMP/build.log" | grep -vE "^> (Run with|Get more help|Task :)" | head -150
          for f in $(find . -path '*/build/reports/lint-results-*.txt' 2>/dev/null); do echo "== $f"; head -80 "$f"; done
          echo "=== END DIGEST ==="
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exiflab-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore

  release:
    name: Publish release
    needs: [engine, android]
    if: contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: exiflab-apk
          path: apk
      - name: Name the APK
        run: |
          f=$(ls apk/*.apk | head -1)
          mv "$f" "apk/ExifLab-1.0.${{ github.run_number }}.apk"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ExifLab 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: apk/*.apk
          body_path: docs/RELEASE_NOTES.md
          make_latest: true
